  meguro_ku:
    name: "目黒区"
    detail_level: full
    as_of: "2026-08-10"
    sources:
      - title: "旅館業の手引き（令和6年1月改訂）"
        url: "https://www.city.meguro.tokyo.jp/documents/3152/ryokan-tebiki_1.pdf"
      - title: "既存住宅等を利用し、旅館・ホテルへの用途変更を検討している皆様へ（令和7年8月8日）"
        url: "https://www.city.meguro.tokyo.jp/documents/18348/ryokanngyou.pdf"
      - title: "旅館業営業許可の手続き"
        url: "https://www.city.meguro.tokyo.jp/seikatsueisei/kenkoufukushi/eisei/ryokantetsuduki.html"
      - title: "既存建築物を宿泊施設へ用途変更する際の注意点"
        url: "https://www.city.meguro.tokyo.jp/kenchiku/shigoto/kenchiku/syukuhakusisetu_youtohenkou.html"

    contacts:
      - role: "旅館業許可（衛生基準）"
        dept: "目黒区保健所 生活衛生課 環境衛生係"
        tel: "03-5722-9502"
        fax: "03-5722-9367"
      - role: "用途変更・建築基準法"
        dept: "目黒区都市整備部 建築課 建築指導係"
        tel: "03-5722-9637"
      - role: "建築士への相談"
        dept: "社団法人東京都建築士事務所協会 目黒支部"
        tel: "03-5724-5061"

    distance_to_school:
      distance_m: 100
      note: >-
        学校（大学除く）・幼保連携型認定こども園・児童福祉施設・社会教育施設・一定の各種学校・
        図書館・区長指定施設等の敷地の周囲おおむね100m以内の場合、環境が著しく害される恐れが
        ないか保健所から関係機関へ意見照会（法3-3、条2）。照会＝即不許可ではないが期間が延びる
      facilities:
        - "学校（大学を除く）"
        - "幼保連携型認定こども園"
        - "児童福祉施設"
        - "社会教育施設"
        - "一定の各種学校"
        - "図書館"
        - "区長が指定する施設"

    room_area:
      min_m2: 7.0
      bed_only_min_m2: 9.0
      note: >-
        旅館・ホテル営業＝1客室7㎡以上（寝台を置く客室は9㎡以上）（令1-1-1）。
        面積算定は壁芯ではなく内法。客室は原則地階に設けられない（衛生上支障がない場合を除く）。
        窓のない客室は不可
      simple_lodging_total_min_m2: 33.0
      simple_lodging_per_guest_m2: 3.3
      simple_lodging_note: >-
        簡易宿所営業＝客室延床33㎡以上（令1-2-1）。宿泊者10人未満は3.3㎡×人数。
        多数人で共用しない客室を設ける場合、その合計床面積は各客室合計床面積の1/2未満（条9-1-5）
      basement_prohibited: true
      window_required: true
      measurement: "内法（壁芯不可）"

    capacity:
      hotel_ryokan_m2_per_guest: 3.0
      simple_lodging_m2_per_guest: 1.5
      note: >-
        旅館・ホテル営業＝有効面積3㎡につき1人（条4-*-6-ア）／
        簡易宿所営業＝有効面積1.5㎡につき1人（条4-*-6-イ）。
        有効面積は寝室等の睡眠・休憩部分のみで、浴室・作りつけ家具部分を含まない
      effective_area_excludes: ["浴室", "作りつけ家具部分", "床の間", "押入れ", "共通廊下"]

    toilet_count_by_capacity:
      table:
        - up_to: 5
          count: 2
        - up_to: 10
          count: 3
        - up_to: 15
          count: 4
        - up_to: 20
          count: 5
        - up_to: 25
          count: 6
        - up_to: 30
          count: 7
      note: >-
        各階に設置し防虫・防臭設備及び手洗設備を要する（条7-*-9-ア）。客室に付設しない場合は
        男女別共同便所とし定員に応じた便器数（条7-*-9-イ）。31人以上・301人以上は加算規定あり。
        便所が客室内にしかない場合、客用スペース以外に従業員用便所が別途必要
      over_30_note: "31人以上および301人以上は加算規定あり（規11）。保健所へ確認"

    washbasin:
      guests_per_tap: 5
      note: "共同洗面所は定員5人につき1給水栓の割合等（規12）。宿泊者需要を満たす規模"

    front_desk:
      required: true
      unmanned_allowed: false
      note: >-
        玄関帳場（フロント）を宿泊者の利用しやすい位置に設置（条7-*-1、条9-2）。
        ICT等の代替設備は可だが【従業員の常駐が必要】＝完全無人運営は不可（旅館・ホテル/簡易宿所/下宿すべて）
      substitute_requirements:
        - "緊急時に通常おおむね10分程度で職員等が駆けつけられる体制"
        - "営業者自ら設置したビデオカメラ等で本人確認・出入り確認を常時鮮明な画像で実施"
        - "鍵の受渡しを適切に行う"
        - "許可施設にビデオカメラを設置し出入りを確認"
        - "宿泊施設と代替設備が通話できる専用の備付設備（宿泊者のスマホ等は不可）"
        - "客室等に緊急通報用の通信手段・テレビ電話/タブレット・スマートロック"
      camera_requirements: >-
        顔が認識できる画質、代替施設で常時（24時間）確認、録画で補完（48時間以上・1週間程度が望ましい）、
        代替施設で再生・確認可能
      remote_front_desk_max_distance_m: 800
      remote_front_desk_note: "フロントを別置する場合は平面図及び旅館までの地図（800m以内）を提出"

    application_fee_yen:
      hotel_ryokan: 30600
      simple_lodging: 16500
      boarding_house: 16500
      note: "申請手数料は現金納付。旅館・ホテル営業30,600円／簡易宿所営業・下宿営業16,500円"

    zoning:
      allowed:
        - "第一種住居地域（用途に供する部分が3,000㎡以下に限る）"
        - "第二種住居地域"
        - "近隣商業地域"
        - "商業地域"
        - "準工業地域"
      prohibited:
        - "第一種低層住居専用地域"
        - "第一種中高層住居専用地域"
        - "第二種中高層住居専用地域"
      not_designated_in_ward:
        - "第二種低層住居専用地域"
        - "準住居地域"
        - "工業地域"
        - "工業専用地域"
      not_designated_note: "目黒区にはこれらの用途地域の指定がない（手引き記載）"
      special_district_prohibitions:
        - "第1種文教地区内は旅館・ホテルを建築できない"
        - "第2種文教地区内は旅館・ホテルを建築できない"
      extra_notes:
        - "地区計画や特別用途地区の区域内は別途用途制限がある"
        - "用途地域がまたがる場合は敷地の過半が属する用途地域の規定が適用される"
      map_service: "めぐろ地図情報サービス https://www.sonicweb-asp.jp/meguro/"

    building_code_notes:
      blocking:
        - id: "roji_site"
          title: "路地状敷地は用途変更不可"
          detail: >-
            路地状敷地の建築物は、旅館・ホテルに用途変更することができません
            （路地幅等による緩和規定あり）。該当すると事業化そのものが不可のため最優先で確認
        - id: "bunkyo_district"
          title: "文教地区は建築不可"
          detail: "第1種・第2種文教地区内は旅館・ホテルを建築できない"
      major:
        - id: "road_frontage"
          title: "接道4m以上"
          detail: "敷地は道路に最低4m以上接道が必要（床面積に応じて必要長さの規定あり）"
        - id: "fireproof_3f"
          title: "3階以上は原則建物全体を耐火建築物"
          detail: >-
            3階以上の階を旅館・ホテルに用途変更する場合、原則建物全体を耐火建築物にする必要がある。
            1〜3階や2〜3階が内部階段等で繋がっている場合、3階を旅館として使用しなくても立入れる
            なら3階部分に旅館用途があるものとみなす。除外規定：階数3・延べ面積200㎡未満かつ
            警報設備を設ける場合（警報設備は住宅用火災警報器ではない）
        - id: "shaft_compartment"
          title: "竪穴区画"
          detail: "地階または3階以上の階を旅館・ホテルに用途変更する場合は竪穴区画が必要"
        - id: "mixed_use_compartment"
          title: "異種用途区画"
          detail: "建築物の一部を旅館・ホテルに用途変更する場合は原則異種用途区画が必要"
        - id: "emergency_lighting"
          title: "非常用照明"
          detail: "居室および居室から地上に通ずる廊下・階段には原則非常用照明の設置が必要"
        - id: "stair_dimensions"
          title: "階段寸法"
          detail: "旅館・ホテルの階段は住宅より蹴上げを低く、踏面を広くする等の寸法規定がある"
        - id: "far_relaxation_lost"
          title: "共同住宅の容積緩和が受けられなくなる"
          detail: >-
            共同住宅を旅館・ホテルに用途変更する場合、容積率算定における共用部分の容積緩和が
            受けられなくなる（既存の容積率が成立しなくなる恐れがあるため要検証）
        - id: "tokyo_safety_ordinance"
          title: "東京都建築安全条例"
          detail: "東京都建築安全条例の特殊建築物の規定に適合させる必要がある"
        - id: "retroactive"
          title: "既存遡及"
          detail: >-
            用途変更する部分以外も、既存不適格事項を含め現行法に適合させる必要がある
            （建築基準法第87条第2項・3項・4項）
      note_200m2: >-
        用途変更の手続きが不要な場合（用途変更面積200㎡以下）でも建築基準法に適合させる必要がある。
        用途変更となる旅館の面積にはリネン室・廊下・階段なども含まれる

    record_availability:
      confirmation_certificate_since_year: 1959
      building_outline_since_year: 1971
      note: >-
        原則、昭和34年（1959年）以降に建築された建物のみ確認可能（建築計画概要書は昭和46年＝1971年以降）。
        書類紛失等で調査できない場合は建築課25番窓口で確認

    extra_rules:
      - "宿泊者名簿は3年間保存し施設又は事務所に備える（法6-1）。日本国内に住所のない外国人は国籍・旅券番号と旅券の写しを保管"
      - "営業施設ごとに管理者を置く（条4-*-12）"
      - "施設名称を公衆の見やすい場所に掲示（条6-*-1）。大きさの目安は住宅宿泊事業法の届出標識程度"
      - "客室内CO2濃度は0.15%以下。開口部は常に開放、機械換気は十分運転"
      - "照度：客室・応接室・食堂40ルクス以上／調理場・配膳室50ルクス以上／廊下・階段は常時20ルクス以上（深夜23時〜翌6時は10ルクス以上）／浴室・脱衣室・洗面所・便所等20ルクス以上"
      - "浴槽は1日1回以上換水・清掃。共同浴室/シャワー室には十分な広さの脱衣室を付設"
      - "寝具は宿泊者ごとにシーツ・カバーを交換・洗濯"
      - "賃借の場合は賃貸人の旅館業用途での使用承諾書が必要（規2-*-5）。転借は賃貸人＋転貸人の承諾（規2-*-6）"
      - "区分所有建物で住居専有部分がある場合は用途に関する規約の写し、規約がない/旅館業の定めがない場合は管理組合が禁止する意思がないことの確認書類（規2-*-7,8）"
      - "半径300m以内の住宅・道路・学校等の見取り図が申請時に必要（規2-*-1）"
      - "許可後も定期的に保健所職員の立入検査がある"

    matched_address_prefixes: ["東京都目黒区"]

