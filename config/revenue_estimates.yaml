version: 2026.08.1
as_of: '2026-08-18'
constants:
  tsubo_m2: 3.30578
  # vacancy_allowance は廃止（v2026.08.1）。稼働率で既に空室を織り込むため二重割引になっていた。
  effective_room_ratio: 0.62
  default_room_area_m2: 18.0
  capacity_m2_per_guest: 8.0
  # 平均宿泊日数（泊）。清掃回数＝稼働室夜÷LOS の分母。1泊しか泊まらない前提だと清掃費が過大になる。
  avg_length_of_stay_nights: 3.0
  # 一棟貸しADRの定員逓減：ADR = 1人単価 × 定員^exponent（1.0=線形）。10人で線形は非現実的なため0.85を既定。
  capacity_adr_exponent: 0.85
  # 定員の上限（消防・旅館業の実務上の頭打ち）
  capacity_max: 16
