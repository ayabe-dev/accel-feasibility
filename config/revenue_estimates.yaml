usali:
  ota_commission_rate: 0.15
  # 清掃の「原価」（1組あたり・万円）。後方互換用の既定値（客室1室相当）。
  cleaning_cost_per_stay_man: 0.04
  # 清掃料金の「収入」（ゲスト請求・1組あたり・万円）。
  # 既定0＝「ADRに清掃費が含まれている」保守側の想定。別途請求するなら課金モデル別の値かUIで指定。
  cleaning_fee_per_stay_man: 0.0
  # 課金モデル別の清掃単価。旧実装は「1泊ごとに清掃」だったため単価が低く設定されていた。
  # 組数ベースに是正したので、1組あたりの実勢単価に置き換える。
  cleaning_by_unit:
    whole:          # 一棟まるごと清掃（戸建て民泊等）
      cost_per_stay_man: 0.12
      fee_per_stay_man: 0.0
    per_room:       # 客室1室あたり
      cost_per_stay_man: 0.04
      fee_per_stay_man: 0.0
  linen_rate: 0.03
  utility_variable_rate: 0.05
  mgmt_fee_rate: 0.05
