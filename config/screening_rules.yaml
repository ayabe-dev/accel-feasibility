# 朝会スクリーニング基準（「購入検討物件にまとめるか」の判定）
#
# ここは朝会の判定閾値の正本。数字を動かすときは出典と適用範囲をコメントで残す（CLAUDE.md §基準）。
# 出典: 2026-08-12 民泊定例 高垣発言「利回り6〜7%が目線」「2億の物件が1億なら激アツ」
#       「雑に"熱いよね"と分かる試算でよい」
#       （../minpaku/projects/minpaku-teirei/民泊定例_運用マニュアル_v1.md §5）
# 出典: 2026-09-07 高橋(ジョージ)提案の朝会3論点 = ①相場との乖離 ②用途変更の可否・難易度 ③利回り
# 適用: 新規物件の一次選別のみ。検討中案件（青葉台など）の投資判断には使わない
version: 2026.09.1
as_of: '2026-09-07'

meeting:
  name: 朝会（毎日15分）
  purpose: 前日に出てきた物件を「購入検討物件にまとめるかどうか」を決める
  minutes: 15
  seconds_per_property: 60   # 1物件の説明時間。議論はこの後
  max_properties: 5          # 15分 ÷（説明60秒＋議論2分）の実務上限
  out_of_scope: 検討中案件の深掘り（青葉台など）。それは定例でやる

# ---------------------------------------------------------------------------
# 論点1：取得額が相場よりどのぐらい安いのか
# ---------------------------------------------------------------------------
price:
  # 「相場」の定義。⚠️取引事例（成約）比較ではない。毎回この一文を出す
  basis_note: >-
    収益価格[A]（NOI還元）と原価法[B]（土地値＋建物）から作った想定適正価格レンジの mid 比。
    取引事例（レインズ成約・取引価格情報）との比較ではない。
  # 適正価格レンジ mid に対する売出価格の乖離（%）。マイナス = 安い
  great_discount_pct: -20.0   # これ以下 = 激アツ（高垣「2億が1億なら激アツ」の弱め版）
  ok_discount_pct: 0.0        # mid 以下なら合格
  reject_premium_pct: 15.0    # mid 比 +15% 超は落とす
  # 目標NOI利回りからの逆算（profitability の backward）で必要指値が出たときの扱い
  hold_if_discount_needed: true

# ---------------------------------------------------------------------------
# 論点2：用途変更は可能か／難易度
# ---------------------------------------------------------------------------
license:
  accept_verdicts: [grantable, conditional]     # 🟢🟡 = 前に進める
  hold_verdicts: [consult, unknown]             # 🟠❓ = 行政協議・情報待ちで保留
  reject_verdicts: [difficult, blocked]         # 🔴⛔ = 落とす
  # 調査パターン（検査済証 × 築年 × 改修履歴）で決まる難易度
  difficulty_by_pattern:
    A: {label: 軽い（検査済証あり・築浅・図書完備）, score: 1}
    B: {label: 標準, score: 2}
    C: {label: 重い（築古・図書欠落）, score: 3}
    D: {label: 最重量（検査済証なし＝法適合調査フル）, score: 4}
    UNKNOWN: {label: 不明（安全側でC相当）, score: 3}
  hold_if_pattern_in: [D]      # 検査済証なしは即落とさず「価格が十分安いか」で見る
  max_months_to_open: 18       # 調査＋申請＋工事の合計。超えたら保留
                               # 出典: 高垣「リノベ2年・10年回収でも響く」＝2年は許容範囲だが
                               #       18ヶ月を超えると朝会で即断できないため保留に落とす（暫定値）

# ---------------------------------------------------------------------------
# 論点3：利回りは良いか
# ---------------------------------------------------------------------------
yield:
  # NOI ÷ 総投資（取得価格＋取得諸費用＋初期工事費）。対取得価格ではない
  basis_note: NOI ÷ 総投資額（取得価格 ×(1+取得諸費用率) ＋ 初期工事費）
  target_noi_yield_pct: 7.0    # これ以上で「載せる」（高垣の目線 6〜7% の上限側）
  min_noi_yield_pct: 5.0       # これ未満は落とす
  min_dscr: 1.2                # 融資が回る線
  min_dscr_hold: 1.0           # これ未満は落とす

# ---------------------------------------------------------------------------
# 判定ラベル
# ---------------------------------------------------------------------------
verdicts:
  list_up:
    label: 🟢 購入検討リストに載せる
    action: 資料5点を揃えて Notion 物件ページを作る（運用マニュアル §2-0）
  hold:
    label: 🟡 保留（1点待ち）
    action: 待ち先と回答期限を明示して、次の朝会に再提出する
  drop:
    label: 🔴 見送り
    action: 落とした理由を1行残す（同じ物件が再提出されるのを防ぐ）

# ---------------------------------------------------------------------------
# これが無いと朝会で答えられない入力（欠けていたら判定を保留にする）
# ---------------------------------------------------------------------------
required_inputs:
  - {key: address,        label: 住所,          why: 用途地域・距離規制・エリア相場の起点}
  - {key: business_type,  label: 業態,          why: 旅館業/簡易宿所/民泊で基準が変わる}
  - {key: floor_area_m2,  label: 延床面積,      why: 200㎡ライン・工事費・定員}
  - {key: floors_above,   label: 地上階数,      why: 法27条耐火・二方向避難}
  - {key: built_year,     label: 築年,          why: 新耐震・調査パターン・残存耐用年数}
  - {key: structure,      label: 構造,          why: 耐火要件・耐用年数・融資年数}
  - {key: has_inspection, label: 検査済証の有無, why: 調査パターン A〜D の主軸}
  - {key: purchase_price, label: 売出価格,      why: 論点1・3が答えられない（最頻の欠落）}
  - {key: land_area,      label: 土地面積,      why: '原価法[B]・土地坪単価。無いと割安判定が収益価格のみになる'}
  - {key: guest_rooms,    label: 想定客室数,    why: 売上の室数。一棟貸しなら不要}
